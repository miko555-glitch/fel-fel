    <script>
        /********************************************************************
         * 1. WEB AUDIO SYNTHESIZER (PURR + SWEET MEOW + COSMIC CHIME)
         ********************************************************************/
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
                this.purrGain = null;
                this.lastMeow = 0;
                this.lastVib = 0;
            }
            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                this.ctx = new AudioCtx();

                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                osc1.type = 'sawtooth';
                osc2.type = 'triangle';
                osc1.frequency.value = 25;
                osc2.frequency.value = 50;

                const lfo = this.ctx.createOscillator();
                lfo.frequency.value = 1.7;
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 4.2;
                lfo.connect(lfoGain);
                lfoGain.connect(osc1.frequency);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 135;

                this.purrGain = this.ctx.createGain();
                this.purrGain.gain.value = 0;

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(this.purrGain);
                this.purrGain.connect(this.ctx.destination);

                osc1.start();
                osc2.start();
                lfo.start();
            }
            setPurr(level) {
                if (!this.enabled) level = 0;
                if (!this.ctx && level > 0.05) this.init();
                if (!this.ctx || !this.purrGain) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const vol = Math.max(0, Math.min(0.30, level * 0.30));
                this.purrGain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.08);

                if (level > 0.3 && navigator.vibrate && performance.now() - this.lastVib > 420) {
                    this.lastVib = performance.now();
                    try { navigator.vibrate(12); } catch (e) {}
                }
            }
            meow(type = 'sweet') {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                const now = this.ctx.currentTime;
                if (now - this.lastMeow < 0.45) return;
                this.lastMeow = now;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();
                osc.type = 'triangle';
                filter.type = 'bandpass';
                filter.frequency.value = 1200;

                if (type === 'sweet') {
                    osc.frequency.setValueAtTime(530, now);
                    osc.frequency.exponentialRampToValueAtTime(860, now + 0.12);
                    osc.frequency.exponentialRampToValueAtTime(650, now + 0.35);
                    osc.frequency.exponentialRampToValueAtTime(480, now + 0.52);
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
                    osc.start(now);
                    osc.stop(now + 0.56);
                } else {
                    osc.frequency.setValueAtTime(620, now);
                    osc.frequency.exponentialRampToValueAtTime(980, now + 0.18);
                    gain.gain.setValueAtTime(0.001, now);
                    gain.gain.linearRampToValueAtTime(0.14, now + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
                    osc.start(now);
                    osc.stop(now + 0.22);
                }

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
            }
        }
        const sound = new SoundEngine();

        /********************************************************************
         * 2. ULTRA-FAST 60FPS 2D COSMIC PHOTO-PORTRAIT & INTERACTIVE FUR ENGINE
         *    - Zero WebGL Lag, Zero Hand Overlay
         *    - Recreates the exact "Hannah" Cosmic Nebula Loaf Cover (1000699973.jpg)
         *      plus the 4 other uploaded photos of Felfel!
         ********************************************************************/
        const canvas = document.getElementById('cosmic-canvas');
        const ctx = canvas.getContext('2d');

        let W = window.innerWidth;
        let H = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        const state = {
            scene: 'cosmic',       // 'cosmic' (Hannah Cover), 'tuesday', 'phone', 'sun', 'bow', 'custom'
            cosmicAura: true,      // Toggles electric-blue & golden nebula glow around Felfel
            love: 88,
            touches: 0,
            purr: 0,
            isDown: false,
            pointerX: 0,
            pointerY: 0,
            lastPointerX: 0,
            lastPointerY: 0,
            vx: 0,
            vy: 0,
            // Cute Animation Timers
            chinLiftTimer: 0,
            boopTimer: 0,
            kneadTimer: 0,
            treatTimer: 0,
            eyeLookX: 0,
            eyeLookY: 0,
            customImg: null
        };

        // Background Cosmic Stars & Shooting Stars
        const bgStars = [];
        const dustParticles = [];
        const furStrands = [];

        function initCosmicSpace() {
            bgStars.length = 0;
            const count = 130;
            for (let i = 0; i < count; i++) {
                const isBright = i < 14;
                const isGold = i % 3 === 0;
                bgStars.push({
                    x: Math.random(),
                    y: Math.random(),
                    r: isBright ? 1.8 + Math.random() * 2.2 : 0.6 + Math.random() * 1.3,
                    phase: Math.random() * Math.PI * 2,
                    speed: 1.5 + Math.random() * 3.0,
                    color: isGold ? '#fbbf24' : '#7dd3fc',
                    bright: isBright
                });
            }
        }

        // Build Interactive Fur Strands mapped onto Felfel's portrait for each scene
        function buildInteractiveFur() {
            furStrands.length = 0;
            const cx = W * 0.5;
            const cy = H * 0.46;
            const scale = Math.min(W, H) * 0.42;

            const count = 480;
            for (let i = 0; i < count; i++) {
                // Distribute strands within Felfel's silhouette depending on active scene
                let rx = (Math.random() - 0.5) * 1.55;
                let ry = (Math.random() - 0.5) * 1.15;

                if (state.scene === 'cosmic') {
                    // Side-3/4 loaf silhouette matching 1000699973.jpg
                    const inBody = Math.hypot((rx + 0.12) * 0.85, (ry - 0.08) * 1.35) < 0.62;
                    const inHead = Math.hypot((rx - 0.34) * 1.15, (ry + 0.14) * 1.15) < 0.38;
                    if (!inBody && !inHead) continue;
                } else {
                    if (Math.hypot(rx * 0.95, ry * 0.95) > 0.72) continue;
                }

                // Determine if strand is in Felfel's snowy-white / electric-blue zone or ginger-gold zone
                let isWhiteBlue = false;
                if (state.scene === 'cosmic') {
                    // White/blue chest, tucked paw, diagonal shoulder stripe, and nose blaze
                    const shoulderStripe = Math.abs((ry - 0.05) - (rx - 0.05) * 0.85) < 0.11 && rx > -0.15 && rx < 0.28;
                    const chestAndPaw = rx > 0.05 && ry > 0.08;
                    const faceBlaze = rx > 0.42 && Math.abs(ry + 0.10) < 0.16;
                    isWhiteBlue = shoulderStripe || chestAndPaw || faceBlaze;
                } else if (state.scene === 'tuesday') {
                    isWhiteBlue = (rx * rx * 1.8 + (ry - 0.12) * (ry - 0.12)) < 0.22;
                } else if (state.scene === 'sun') {
                    isWhiteBlue = Math.abs(rx) < 0.38 && ry > -0.25;
                } else {
                    isWhiteBlue = ry > 0.05 || Math.abs(rx) < 0.18;
                }

                const baseAngle = Math.atan2(ry, rx) * 0.35 + (isWhiteBlue ? 0.4 : 0.15);
                furStrands.push({
                    nx: rx,
                    ny: ry,
                    x: cx + rx * scale,
                    y: cy + ry * scale,
                    baseAngle,
                    angle: baseAngle,
                    vel: 0,
                    len: (13 + Math.random() * 11) * (scale / 170),
                    isWhiteBlue,
                    glow: 0
                });
            }
        }

        function resizeStage() {
            W = window.innerWidth;
            H = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildInteractiveFur();
        }
        initCosmicSpace();
        resizeStage();
        window.addEventListener('resize', resizeStage);

        /********************************************************************
         * 3. DRAWING THE 5 EXACT PHOTO SCENES OF FELFEL + "Hannah" SPACE COVER
         ********************************************************************/

        // Helper: Draw 4-point glowing cosmic star (matches 1000699973.jpg bright stars)
        function drawStarFlare(x, y, radius, color) {
            ctx.save();
            ctx.translate(x, y);
            const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 3.5);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.25, color);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, radius * 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-radius * 4.2, 0);
            ctx.lineTo(radius * 4.2, 0);
            ctx.moveTo(0, -radius * 4.2);
            ctx.lineTo(0, radius * 4.2);
            ctx.stroke();
            ctx.restore();
        }

        // Helper: Draw Glowing Constellation "Hannah" Script below Felfel (Exact match to 1000699973.jpg)
        function drawHannahConstellation(cx, y, scale, t) {
            ctx.save();
            ctx.translate(cx, y);
            const pulse = 0.85 + 0.15 * Math.sin(t * 2.5);

            ctx.font = `700 ${Math.round(scale * 0.44)}px 'Caveat', cursive`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Outer electric blue nebula glow
            ctx.shadowColor = '#0ea5e9';
            ctx.shadowBlur = 22 * pulse;
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
            ctx.lineWidth = 4;
            ctx.strokeText('Hannah', 0, 0);

            // Inner bright cyan-white starlight core
            ctx.shadowColor = '#7dd3fc';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#e0f2fe';
            ctx.fillText('Hannah', 0, 0);

            // Constellation key stars along the "Hannah" letters
            const starOffsets = [
                [-0.52, -0.09], [-0.46, 0.11], [-0.34, -0.10], [-0.39, 0.10],
                [-0.22, 0.04], [-0.05, 0.04], [0.12, 0.04], [0.32, -0.09], [0.45, 0.05]
            ];
            for (let i = 0; i < starOffsets.length; i++) {
                const sx = starOffsets[i][0] * scale;
                const sy = starOffsets[i][1] * scale;
                const tw = 1.8 + Math.sin(t * 4 + i) * 0.9;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(sx, sy, tw, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.ellipse(-s * 0.26, -s * 0.24, s * 0.22, s * 0.15, -0.4, 0, Math.PI * 2);
            ctx.ellipse(s * 0.26, -s * 0.24, s * 0.22, s * 0.15, 0.4, 0, Math.PI * 2);
            ctx.fill();

            // Big Glossy Bambi Eyes
            [-1, 1].forEach(dir => {
                ctx.fillStyle = '#18181b';
                ctx.beginPath();
                ctx.arc(dir * s * 0.22, -s * 0.06, s * 0.095, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(dir * s * 0.20, -s * 0.09, s * 0.032, 0, Math.PI * 2);
                ctx.fill();
            });

            // Big Cute Pink Fisheye Nose & Happy ":3" Smile
            ctx.fillStyle = '#fb7185';
            ctx.beginPath();
            ctx.ellipse(0, s * 0.04, s * 0.11, s * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#be123c';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(-s * 0.06, s * 0.15, s * 0.06, 0, Math.PI);
            ctx.arc(s * 0.06, s * 0.15, s * 0.06, 0, Math.PI);
            ctx.stroke();

            // Cute Pink Ribbon Bow on Right Ear (exact match to 1000697930_2.jpg!)
            ctx.save();
            ctx.translate(s * 0.34, -s * 0.34);
            ctx.rotate(0.35);
            ctx.fillStyle = '#f472b6';
            ctx.strokeStyle = '#fbcfe8';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(-s * 0.10, 0, s * 0.10, s * 0.065, -0.2, 0, Math.PI * 2);
            ctx.ellipse(s * 0.10, 0, s * 0.10, s * 0.065, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(0, 0, s * 0.045, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.restore();
        }

        // Custom Uploaded Photo Renderer (if user chooses a photo file from phone)
        function drawCustomUploadedPhoto(cx, cy, s, t, breath, boopSquish) {
            if (!state.customImg) return;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(1 + boopSquish * 0.04, 1 + breath * 0.015 - boopSquish * 0.04);

            if (state.cosmicAura) {
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 32;
            }

            const w = s * 1.65;
            const h = s * 1.65 * (state.customImg.height / state.customImg.width);
            ctx.beginPath();
            ctx.roundRect(-w * 0.5, -h * 0.5, w, h, 28);
            ctx.clip();
            ctx.drawImage(state.customImg, -w * 0.5, -h * 0.5, w, h);
            ctx.restore();

            drawHannahConstellation(cx, cy + s * 0.82, s, t);
        }

        /********************************************************************
         * 4. UI ACTIONS & SCENE SWITCHING
         ********************************************************************/
        function setPhotoScene(sceneName) {
            state.scene = sceneName;
            ['cosmic', 'tuesday', 'phone', 'sun', 'bow'].forEach(id => {
                const btn = document.getElementById('scene-' + id);
                if (!btn) return;
                if (id === sceneName) btn.classList.add('active-scene');
                else btn.classList.remove('active-scene');
            });
            buildInteractiveFur();
            sound.meow('sweet');

            const titles = {
                cosmic: 'غلاف فلفل الفضائي ✨ Hannah',
                tuesday: 'لقطة Tuesday like this 😻',
                phone: 'كله م الهباب الزفت الموبايل 📱',
                sun: 'رفعة الدقن في الشمس ☀️♡',
                bow: 'لقطة الفيونكة البينك الكيوت 🎀'
            };
            if (titles[sceneName]) {
                spawnFloatingText(W * 0.5, H * 0.25, titles[sceneName]);
            }
        }

        function handleUserPhoto(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    state.customImg = img;
                    state.scene = 'custom';
                    buildInteractiveFur();
                    sound.meow('sweet');
                    spawnFloatingText(W * 0.5, H * 0.25, 'تم تركيب صورة فلفل الأصلية مع شعر ونجوم متفاعلة! 📸🌌');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setInteractionMode(mode) {
            document.getElementById('hint-msg').textContent = 'اسحب بصوباعك على فلفل عشان تسرح شعره وتطلع نجوم وقلوب!';
        }

        function triggerCuteAnim(type) {
            if (type === 'chin') {
                state.chinLiftTimer = 1.0;
                sound.setPurr(0.95);
                spawnFloatingText(W * 0.5, H * 0.28, 'فلفل رافع دقنه ومغمض عيونه من الدلع 😌💙');
            } else if (type === 'boop') {
                state.boopTimer = 1.0;
                sound.meow('sweet');
                spawnFloatingText(W * 0.5, H * 0.28, 'بوسة على مناخير فلفل البينك! 👃💗');
            } else if (type === 'knead') {
                state.kneadTimer = 1.0;
                sound.meow('trill');
                spawnFloatingText(W * 0.5, H * 0.28, 'فلفل بيعجن بكفوفه البيضا من الفرحة! 🐾🥐');
            } else if (type === 'treat') {
                state.treatTimer = 1.0;
                sound.meow('sweet');
                spawnFloatingText(W * 0.5, H * 0.28, 'أحلى سمكة لفلفل حبيبنا! 🐟😋');
                for (let i = 0; i < 6; i++) {
                    spawnHeart(W * (0.3 + Math.random() * 0.4), H * (0.4 + Math.random() * 0.2), i % 2 === 0 ? '🐟' : '💙');
                }
            }
            incrementLove(3);
        }

        function triggerSupernovaLove() {
            sound.meow('sweet');
            for (let i = 0; i < 28; i++) {
                const angle = (i / 28) * Math.PI * 2;
                const sp = 2 + Math.random() * 5;
                dustParticles.push({
                    x: W * 0.5,
                    y: H * 0.45,
                    vx: Math.cos(angle) * sp,
                    vy: Math.sin(angle) * sp,
                    r: 2.5 + Math.random() * 3.5,
                    life: 1.0,
                    color: i % 2 === 0 ? '#38bdf8' : '#fbbf24'
                });
            }
            spawnFloatingText(W * 0.5, H * 0.26, 'شلال نجوم لعيون فلفل (لولو) ✨🌌💙');
            incrementLove(5);
        }

        function toggleCosmicAura() {
            state.cosmicAura = !state.cosmicAura;
            const btn = document.getElementById('btn-cosmic-glow');
            btn.className = state.cosmicAura
                ? 'cosmic-btn w-9 h-9 rounded-2xl bg-sky-500/30 border border-sky-300/60 flex items-center justify-center text-base shadow-sm'
                : 'cosmic-btn w-9 h-9 rounded-2xl bg-slate-900/90 border border-sky-500/30 flex items-center justify-center text-base opacity-60 shadow-sm';
        }

        function toggleAudio() {
            sound.enabled = !sound.enabled;
            const icon = document.getElementById('sound-icon');
            if (sound.enabled) {
                icon.className = 'fa-solid fa-volume-high';
                sound.meow('trill');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-rose-400';
                sound.setPurr(0);
            }
        }

        function incrementLove(amount = 1) {
            state.touches++;
            state.love = Math.min(100, state.love + amount);
            document.getElementById('touch-counter').textContent = state.touches;
            document.getElementById('love-bar').style.width = `${state.love}%`;
            document.getElementById('love-txt').textContent = `${state.love}%`;
        }

        function spawnFloatingText(x, y, text) {
            const layer = document.getElementById('fx-layer');
            const el = document.createElement('div');
            el.className = 'float-item text-xs sm:text-sm bg-slate-950/90 text-sky-200 px-3.5 py-1 rounded-full border border-sky-400/50 shadow-lg';
            el.style.left = `${Math.max(90, Math.min(W - 90, x))}px`;
            el.style.top = `${Math.max(105, Math.min(H - 175, y))}px`;
            el.textContent = text;
            layer.appendChild(el);
            setTimeout(() => el.remove(), 1100);
        }

        function spawnHeart(x, y, emoji = '💙') {
            const layer = document.getElementById('fx-layer');
            const el = document.createElement('div');
            el.className = 'float-item text-xl';
            el.style.left = `${x + (Math.random() - 0.5) * 30}px`;
            el.style.top = `${y}px`;
            el.textContent = emoji;
            layer.appendChild(el);
            setTimeout(() => el.remove(), 1050);
        }

        /********************************************************************
         * 5. TOUCH & SWIPE INTERACTION (PARTING FUR + STARLIGHT TRAIL)
         ********************************************************************/
        let lastHeartTime = 0;

        function onMovePointer(x, y) {
            state.vx = x - state.lastPointerX;
            state.vy = y - state.lastPointerY;
            state.lastPointerX = x;
            state.lastPointerY = y;
            state.pointerX = x;
            state.pointerY = y;

            state.eyeLookX = (x - W * 0.5) / (W * 0.5);
            state.eyeLookY = (y - H * 0.45) / (H * 0.5);

            // Spawn cosmic stardust particles along finger stroke
            for (let i = 0; i < 2; i++) {
                dustParticles.push({
                    x: x + (Math.random() - 0.5) * 16,
                    y: y + (Math.random() - 0.5) * 16,
                    vx: (Math.random() - 0.5) * 1.8 + state.vx * 0.08,
                    vy: -0.8 - Math.random() * 1.5,
                    r: 1.8 + Math.random() * 2.4,
                    life: 1.0,
                    color: Math.random() > 0.45 ? '#38bdf8' : '#fbbf24'
                });
            }

            // Bend interactive fur strands near the finger!
            const brushRadius = 68;
            const moveAngle = Math.atan2(state.vy, state.vx);
            let touchedAnyStrand = false;

            for (let i = 0; i < furStrands.length; i++) {
                const f = furStrands[i];
                const dx = f.x - x;
                const dy = f.y - y;
                const dist = Math.hypot(dx, dy);
                if (dist < brushRadius) {
                    touchedAnyStrand = true;
                    const influence = (1 - dist / brushRadius);
                    f.angle += (moveAngle - f.angle) * influence * 0.55;
                    f.glow = Math.min(1.0, f.glow + influence * 0.65);
                }
            }

            if (touchedAnyStrand) {
                state.purr = Math.min(1.0, state.purr + 0.09);
                const now = performance.now();
                if (now - lastHeartTime > 260) {
                    lastHeartTime = now;
                    incrementLove(1);
                    const emojis = ['💙', '✨', '🧡', '🐾'];
                    spawnHeart(x, y - 24, emojis[Math.floor(Math.random() * emojis.length)]);
                    if (Math.random() < 0.14) sound.meow('sweet');
                }
            }
        }

        window.addEventListener('touchstart', (e) => {
            if (e.target.closest('header') || e.target.closest('footer')) return;
            const touch = e.touches[0];
            state.isDown = true;
            state.lastPointerX = touch.clientX;
            state.lastPointerY = touch.clientY;
            onMovePointer(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!state.isDown || e.target.closest('header') || e.target.closest('footer')) return;
            const touch = e.touches[0];
            onMovePointer(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('touchend', () => { state.isDown = false; });

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('header') || e.target.closest('footer')) return;
            state.isDown = true;
            state.lastPointerX = e.clientX;
            state.lastPointerY = e.clientY;
            onMovePointer(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (!state.isDown) return;
            onMovePointer(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', () => { state.isDown = false; });

        /********************************************************************
         * 6. MAIN 60FPS RENDER LOOP (LIGHTWEIGHT & SMOOTH)
         ********************************************************************/
        function animate() {
            requestAnimationFrame(animate);
            const t = performance.now() * 0.001;

            ctx.clearRect(0, 0, W, H);

            // 1. Render Twinkling Space Stars
            for (let i = 0; i < bgStars.length; i++) {
                const st = bgStars[i];
                const alpha = 0.35 + 0.65 * Math.abs(Math.sin(t * st.speed + st.phase));
                const sx = st.x * W;
                const sy = st.y * H;

                ctx.fillStyle = st.color;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(sx, sy, st.r, 0, Math.PI * 2);
                ctx.fill();

                if (st.bright) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(sx - st.r * 3.2, sy);
                    ctx.lineTo(sx + st.r * 3.2, sy);
                    ctx.moveTo(sx, sy - st.r * 3.2);
                    ctx.lineTo(sx, sy + st.r * 3.2);
                    ctx.stroke();
                }
            }
            ctx.globalAlpha = 1.0;

            // Decay animation timers smoothly
            state.chinLiftTimer = Math.max(0, state.chinLiftTimer - 0.012);
            state.boopTimer = Math.max(0, state.boopTimer - 0.025);
            state.kneadTimer = Math.max(0, state.kneadTimer - 0.010);
            state.treatTimer = Math.max(0, state.treatTimer - 0.015);

            if (!state.isDown && state.chinLiftTimer <= 0) {
                state.purr = Math.max(0, state.purr - 0.02);
            }
            sound.setPurr(state.purr);

            const purrPill = document.getElementById('purr-pill');
            if (state.purr > 0.25) purrPill.classList.remove('hidden');
            else purrPill.classList.add('hidden');

            // 2. Render Active Felfel Photo Scene
            const cx = W * 0.5;
            const cy = H * 0.45;
            const scale = Math.min(W, H) * 0.40;
            const breath = Math.sin(t * 2.7);
            const kneadWave = state.kneadTimer > 0 ? Math.sin(t * 9.0) * state.kneadTimer : 0;
            const boopWave = Math.sin(state.boopTimer * Math.PI);

            if (state.scene === 'cosmic') {
                drawCosmicHannahLoaf(cx, cy, scale, t, breath, state.chinLiftTimer, boopWave, kneadWave);
            } else if (state.scene === 'tuesday') {
                drawTuesdayCloseUp(cx, cy, scale, t, breath, state.chinLiftTimer, boopWave);
            } else if (state.scene === 'phone') {
                drawPhoneHugScene(cx, cy, scale, t, breath, kneadWave);
            } else if (state.scene === 'sun') {
                drawSunnyChinScene(cx, cy, scale, t, breath, kneadWave);
            } else if (state.scene === 'bow') {
                drawPinkBowScene(cx, cy, scale, t, breath, boopWave);
            } else if (state.scene === 'custom') {
                drawCustomUploadedPhoto(cx, cy, scale, t, breath, boopWave);
            }

            // 3. Render Interactive Silky Fur Strands & Cosmic Starlight Tips
            ctx.lineCap = 'round';
            for (let i = 0; i < furStrands.length; i++) {
                const f = furStrands[i];
                // Spring back to natural fur flow
                const springForce = (f.baseAngle - f.angle) * 0.12;
                f.vel = (f.vel + springForce) * 0.82;
                f.angle += f.vel;
                f.glow *= 0.94;

                const ex = f.x + Math.cos(f.angle) * f.len;
                const ey = f.y + Math.sin(f.angle) * f.len;

                if (f.isWhiteBlue) {
                    ctx.strokeStyle = f.glow > 0.15
                        ? `rgba(125, 211, 252, ${0.45 + f.glow * 0.55})`
                        : (state.cosmicAura ? 'rgba(186, 230, 253, 0.36)' : 'rgba(255, 255, 255, 0.40)');
                } else {
                    ctx.strokeStyle = f.glow > 0.15
                        ? `rgba(253, 224, 71, ${0.45 + f.glow * 0.55})`
                        : 'rgba(251, 146, 60, 0.36)';
                }

                ctx.lineWidth = 1.6 + f.glow * 1.4;
                ctx.beginPath();
                ctx.moveTo(f.x, f.y);
                ctx.lineTo(ex, ey);
                ctx.stroke();
            }

            // 4. Render Floating Cosmic Stardust Trail
            for (let i = dustParticles.length - 1; i >= 0; i--) {
                const p = dustParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.024;
                if (p.life <= 0) {
                    dustParticles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }

        window.onload = function () {
            animate();
        };
    </script>
